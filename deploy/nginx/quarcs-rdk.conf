server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /var/www/html;
    index index.html;
    server_name _;

    location ~ ^/api/indi-startup(/restart)?$ {
        client_max_body_size 2k;
        proxy_set_header X-Quarcs-Origin $scheme://$http_host;
        proxy_pass http://unix:/run/quarcs-indi-startup.sock;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
